packages:
  - frontend
  - backend

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  # onnxruntime-node ships its macOS/Windows/Linux CPU+WebGPU binaries in the package. Its install script only
  # downloads the optional CUDA execution provider, which this project doesn't use.
  onnxruntime-node: false
  protobufjs: false
  sharp: false

patchedDependencies:
  mediabunny@1.65.2: patches/mediabunny@1.65.2.patch
